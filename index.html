<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SALS 스마트의료지도 · 훈련용</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E4032E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
 --red:#E4032E;--red2:#C8022A;--ink:#17171B;--sub:#77777F;--line:#E5E5EA;--line2:#C9C9D1;
 --bg:#F2F3F6;--yel:#FFF6C9;--ok:#12A150;--blue:#2C6ED5;--dk:#0A0A0C;--gray:#8D8D96;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#25252A;color:var(--ink);font-size:15px;line-height:1.45;
 font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;outline:none}
.wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:10px}
.ph{width:100%;max-width:400px;height:min(860px,calc(100dvh - 20px));background:#fff;border-radius:20px;
 overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 16px 46px rgba(0,0,0,.5)}
.ph.land{max-width:920px}
/* 통화 중: 폰을 세로로 들고 있어도 화면만 90도 돌려 가로로 표시 */
@media (orientation:portrait){
  body.landmode{overflow:hidden}
  body.landmode .ph.land{
    position:fixed;top:50%;left:50%;
    width:100dvh;height:100dvw;max-width:none;
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
    border-radius:0;box-shadow:none;z-index:400}
}
.hide{display:none!important}
.bar{flex:0 0 auto;background:#fff;color:#4A4A52;font-size:10.5px;padding:4px 12px;display:flex;justify-content:space-between}
.bar.dk{background:#000;color:#9C9CA6}
.chipT{position:absolute;right:62px;top:9px;z-index:300;background:rgba(228,3,46,.85);color:#fff;font-size:9.5px;
 font-weight:700;padding:2px 6px;border-radius:8px}

/* 헤더 */
.hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);background:#fff}
.lg{font-weight:800;font-size:17px;letter-spacing:.3px}.lg i{color:var(--red);font-style:normal}
.hd .t{font-weight:700;font-size:15.5px}
.gw{flex:1}
.ib{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#5A5A63}
.ib:active{background:#EFEFF3}
.ib.pl{border:1.6px solid var(--gray);color:var(--gray);font-size:19px;width:29px;height:29px}
.sc{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:5px 11px}
.sc input{border:0;width:100%;font-size:12.5px;background:none}
.pill{border:1px solid var(--line2);border-radius:12px;padding:3px 9px;font-size:10.5px;color:var(--sub);white-space:nowrap}

/* 필터 */
.filt{flex:0 0 auto;display:flex;gap:0;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.fc{flex:0 0 auto;border:1px solid var(--line2);border-radius:13px;padding:4px 11px;font-size:11.5px;color:var(--sub);
 background:#fff;margin-right:5px}
.fc.on{background:#4A4A52;border-color:#4A4A52;color:#fff;font-weight:700}
.body{flex:1;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}

/* 하단탭 */
.nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:6px 0 7px;display:grid;gap:1px;justify-items:center;font-size:10px;color:#95959E}
.nav .ic{font-size:16px;line-height:1.1}
.nav button.on{color:var(--red);font-weight:700}

/* 환자카드 */
.pc{background:#fff;border-bottom:1px solid var(--line);padding:10px 11px;display:flex;gap:9px}
.pc.al{background:var(--yel)}
.bd{flex:0 0 52px;text-align:center}
.mk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto 2px;font-size:19px;
 border:2px solid var(--red);color:var(--red)}
.mk.o{border-color:#E8A32B;color:#E8A32B}.mk.g{border-color:var(--ok);color:var(--ok)}
.mk.y{border-color:var(--gray);color:var(--gray)}
.stt{font-size:10px;font-weight:700;color:var(--red)}
.stt.o{color:#C97D06}.stt.g{color:var(--ok)}.stt.y{color:var(--gray)}
.pin{flex:1;min-width:0}
.pnm{font-weight:700;font-size:13.5px}
.pdt{font-size:9.5px;color:var(--sub);text-align:right;white-space:pre-line;line-height:1.25;margin-left:auto;flex:0 0 auto}
.r1{display:flex;gap:5px;align-items:flex-start}
.pl2{font-size:11.5px;color:#4A4A52;margin-top:3px}
.pl2 .k{color:var(--sub)}
.no{color:var(--red);font-weight:700}.yes{color:var(--blue);font-weight:700}
.acts{display:flex;gap:5px;margin-top:8px}
.acts button{flex:1;border:1px solid var(--line2);border-radius:4px;padding:7px 0;font-size:11px;background:#fff}
.acts button:active{background:#F0F0F4}
.emp{padding:50px 22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}

/* 시트 */
.veil{position:absolute;inset:0;background:rgba(6,6,10,.42);z-index:40;display:none}
.veil.on{display:block}
.sh{position:absolute;inset:0;background:#fff;z-index:50;display:none;flex-direction:column}
.sh.on{display:flex}
.shb{flex:1;overflow-y:auto;padding:14px 13px 16px}
.shf{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fff;
 padding-bottom:env(safe-area-inset-bottom)}
.shf button{flex:1;padding:13px 0;font-size:13.5px;color:var(--blue);font-weight:600}
.shf button.gr{color:var(--sub)}
.shf button:active{background:#F2F4F8}
.mt{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.mt::before{content:'☀';color:var(--red);font-size:15px}
.lb{font-size:12px;color:#4A4A52;margin:14px 0 6px}
.lb b{color:var(--red)}
.gr2{display:grid;gap:5px;grid-template-columns:1fr 1fr}
.gr3{display:grid;gap:5px;grid-template-columns:repeat(3,1fr)}
.gr5{display:grid;gap:5px;grid-template-columns:repeat(5,1fr)}
.op{border:1px solid var(--line2);border-radius:3px;padding:10px 2px;text-align:center;font-size:12px;background:#fff}
.op.on{background:#54545C;color:#fff;border-color:#54545C;font-weight:700}
.und{width:100%;border:0;border-bottom:1.5px solid var(--line2);padding:7px 2px;font-size:14px}
.und:focus{border-color:var(--blue)}
.ul{font-size:11px;color:var(--sub);margin-top:3px}
.nt{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.6}
.tck{display:flex;align-items:center;gap:5px;font-size:12px;color:#4A4A52}
.tck input{width:15px;height:15px}

/* 지도의사 */
.dsec{font-size:11px;color:var(--sub);background:#F4F5F8;padding:5px 11px;margin:0 -13px 0}
.doc{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.av{width:26px;height:26px;border-radius:50%;background:#EFEFF3;display:grid;place-items:center;font-size:13px;color:#A0A0A9}
.dnm{font-size:12.5px;font-weight:600}
.dnm em{font-style:normal;color:var(--sub);font-weight:400}
.dhp{font-size:10.5px;color:var(--sub)}
.bg1{font-size:9px;font-weight:700;color:#fff;background:var(--ok);border-radius:7px;padding:1px 6px;margin-left:4px}
.bg2{font-size:9px;font-weight:700;color:#fff;background:var(--blue);border-radius:7px;padding:1px 6px;margin-left:4px}
.dac{margin-left:auto;display:flex;gap:7px;align-items:center}
.ci{width:24px;height:24px;display:grid;place-items:center;font-size:14px;color:#6A6A73}
.cv{width:29px;height:29px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}

/* 발신중 */
.ring{position:absolute;inset:0;background:#fff;z-index:60;display:none;flex-direction:column;align-items:center;padding:30px 20px 40px}
.ring.on{display:flex}
.rs{font-size:12.5px;color:var(--sub)}
.rt{font-family:ui-monospace,Menlo,monospace;font-size:20px;color:var(--ok);margin-top:1px}
.rbar{width:112px;height:2.5px;background:var(--ok);margin-top:7px;animation:pls 1.1s infinite}
@keyframes pls{0%,100%{opacity:.2}50%{opacity:1}}
.rmd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rlg{font-size:36px;font-weight:800}.rlg i{color:var(--red);font-style:normal}
.rnm{font-size:16px;font-weight:700;margin-top:20px}
.rhp{font-size:12px;color:var(--sub)}.rdz{font-size:13.5px;color:var(--red);font-weight:700;margin-top:2px}
.hang{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
 align-content:center;gap:1px;font-size:12px}
.hang b{font-size:20px;transform:rotate(133deg)}

/* 화상통화 */
.call{position:absolute;inset:0;background:var(--dk);z-index:70;display:none;flex-direction:column}
.call.on{display:flex}
.ctop{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:5px 10px;color:#fff;font-size:15px}
.ctop button{width:26px;height:22px;display:grid;place-items:center}
.ctop .fl.on{color:#FFC93C}
.stg{flex:1;display:flex;min-height:0}
.lft{flex:0 0 47%;display:flex;flex-direction:column;min-width:0;padding:0 4px 4px 6px}
.warn{font-size:9.5px;color:#FF8FA0;padding:2px 0 4px;display:flex;gap:3px;align-items:center;line-height:1.3}
.warn b{color:#FFC93C}
.pnl{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;border:1.5px solid var(--red);padding:3px;border-radius:2px}
.tb{grid-column:span 2;background:#fff;color:#111;border-radius:2px;min-height:31px;display:grid;align-content:center;gap:0;
 padding:3px 1px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tb .n{font-size:9.5px;font-weight:700;line-height:1.15}
.tb .t{font-size:8px;color:var(--red);font-family:ui-monospace,Menlo,monospace;line-height:1.2}
.tb:active{background:#FFD4DC}
.tb.w{grid-column:span 6}
.tb.w2{grid-column:span 3}
.tb.h{background:#FFE7EC}
.logbox{flex:1;margin-top:5px;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;
 color:#EDEDF2;line-height:1.65;min-height:0}
.logbox div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logbox .hl{background:#3B6FCB;color:#fff}
.vw{flex:1;position:relative;background:#000;min-width:0;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.noc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#87878F;font-size:11.5px;padding:16px;line-height:1.7}
.noc button{border:1px solid #45454E;border-radius:5px;padding:6px 12px;color:#DCDCE2;margin-top:8px;font-size:11.5px}
.tmpill{position:absolute;top:6px;left:8px;background:rgba(30,30,34,.72);color:#fff;font-size:11px;
 font-family:ui-monospace,Menlo,monospace;padding:2px 9px;border-radius:11px;display:flex;gap:4px;align-items:center}
.tmpill i{color:#3ED07A;font-style:normal;font-size:10px}
.cnow{position:absolute;right:7px;bottom:5px;color:#D8D8DE;font-size:9.5px;font-family:ui-monospace,Menlo,monospace}
.ctrl{position:absolute;right:7px;top:6px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;transition:.15s}
.ctrl.off{opacity:0;pointer-events:none}
.rw{display:flex;gap:6px}
.rb{width:31px;height:31px;border-radius:50%;background:rgba(24,24,28,.85);color:#fff;display:grid;place-items:center;font-size:13px}
.rb.end{background:var(--red);font-size:15px}
.rb.mute{background:#fff;color:#111}
.snp{position:absolute;left:7px;bottom:20px;width:52px;border:2px solid #fff;border-radius:3px;display:none}

/* 팝업 */
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,90%);background:#fff;
 border-radius:8px;z-index:95;display:none;overflow:hidden;box-shadow:0 12px 38px rgba(0,0,0,.4)}
.pop.on{display:block}
.pph{padding:11px 14px 3px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:5px}
.pph::before{content:'☀';color:var(--red)}
.ppn{padding:0 14px;font-size:11px;color:var(--sub)}
.ppb{padding:9px 14px 4px;max-height:46dvh;overflow-y:auto;font-size:13px;color:#33333A;line-height:1.6}
.ppf{display:flex;border-top:1px solid var(--line);margin-top:8px}
.ppf button{flex:1;padding:10px 0;font-size:13px;color:var(--blue);font-weight:600}
.ppf button.g{color:var(--sub)}
.ppf button+button{border-left:1px solid var(--line)}
.kv{display:flex;align-items:center;gap:7px;margin:6px 0}
.kv label{flex:0 0 auto;font-size:13px}
.kv input{flex:1;border:0;border-bottom:1.5px solid var(--line2);padding:6px 2px;font-size:14px}
.pickg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0 2px}
.pickg button{border:1px solid var(--line2);border-radius:3px;padding:8px 2px;font-size:12px}
.pickg button.on{background:#54545C;color:#fff;border-color:#54545C;font-weight:700}

/* 채팅 */
.chat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,94%);height:min(300px,80%);
 background:#fff;border-radius:6px;z-index:96;display:none;flex-direction:column;overflow:hidden}
.chat.on{display:flex}
.chh{padding:8px;text-align:center;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line);position:relative}
.chh button{position:absolute;right:8px;top:6px;color:var(--sub);font-size:15px}
.chm{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:6px;background:#fff}
.sysm{text-align:center;font-size:11px;color:#6A6A73;text-decoration:underline;margin:2px 0}
.bb{max-width:72%;padding:6px 10px;border-radius:4px;font-size:12.5px;line-height:1.45;position:relative}
.bb.me{align-self:flex-end;background:#2C7BE5;color:#fff}
.bb.yo{align-self:flex-start;background:#1B1B1F;color:#fff}
.bt{font-size:9.5px;color:#9A9AA3;align-self:flex-end;margin:0 3px}
.bnm{font-size:10px;color:#6A6A73;align-self:flex-start}
.chi{display:flex;gap:6px;padding:7px;border-top:1px solid var(--line)}
.chi input{flex:1;border:1px solid var(--line2);border-radius:15px;padding:7px 12px;font-size:12.5px}
.chi button{width:30px;height:30px;border-radius:50%;background:#2C7BE5;color:#fff;font-size:13px}

/* 기록보기 */
.tabs{flex:0 0 auto;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 0;font-size:12px;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--red);font-weight:700;border-bottom-color:var(--red)}
.crow{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px}
.crow .ic{color:var(--blue);font-size:15px}
.crow .t{font-size:12.5px;font-weight:600}
.crow .s{font-size:10.5px;color:var(--sub)}
.crow .r{margin-left:auto;text-align:right;font-size:10.5px;color:var(--sub)}
.crow .r b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#33333A}
.fday{padding:9px 12px 3px;font-size:11.5px;color:var(--blue);font-weight:700;background:#fff}
.fl2{padding:2px 12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:#2E2E35;background:#fff}
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px}
.caps img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}

/* 기록지 */
.doc9{padding:10px;background:#fff;min-height:100%}
.d9h{font-size:12.5px;font-weight:800;margin-bottom:9px;display:flex;align-items:baseline;gap:6px}
.d9v{font-weight:400;font-size:10.5px;color:var(--sub);margin-left:auto}
.d9s2{font-size:11.5px;font-weight:700;background:#EDEEF2;border:1px solid var(--line);
 border-bottom:0;padding:4px 9px;margin:12px 0 0;display:inline-block;border-radius:2px 2px 0 0}
.d9n{font-size:9.5px;color:var(--sub);line-height:1.5;margin:1px 0 4px}
.frw{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;margin:5px 0}
.fl{font-size:11px;color:#3A3A42;line-height:1.35}
.fl.req{color:#17171B}
.rq{color:var(--red);font-size:11px;margin-left:1px}
.fi input{border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:3px 4px;
 font-size:11.5px;background:#fff;text-align:center;max-width:100%}
.fi.miss input{border-color:var(--red);background:#FFF4F6}
.fck{width:17px;height:17px;border:1px solid var(--line2);border-radius:2px;display:inline-block;
 position:relative;background:#fff}
.fck.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;
 font-size:12px;color:var(--red);font-weight:800}
.sg2{display:inline-flex;flex-wrap:wrap;gap:3px}
.sg2 button{border:1px solid var(--line2);border-radius:2px;padding:4px 8px;font-size:10.5px;
 background:#fff;color:#3A3A42;line-height:1.25}
.sg2 button.on{background:#54545C;color:#fff;border-color:#54545C;font-weight:600}
.sg2.miss button{border-color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:10px}
.tbl th,.tbl td{border:1px solid var(--line2);padding:3px 4px;text-align:center}
.tbl th{background:#F1F2F6;font-weight:700}
/* 시간별 상황기록 격자 */
.d9g{font-size:9.5px;font-weight:700;text-align:center;line-height:1.4;margin-bottom:6px}
.gzoom{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--sub);margin-bottom:5px}
.gzoom button{border:1px solid var(--line2);border-radius:3px;padding:3px 9px;font-size:11px;background:#fff}
.gwrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line2);max-height:62vh}
.grid{border-collapse:collapse;white-space:nowrap}
.grid th,.grid td{border:1px solid var(--line2);padding:1px 2px;text-align:center;font-weight:400}
.grid th{background:#EDEEF3;font-weight:700;position:sticky;top:0;z-index:2;vertical-align:bottom}
.grid th.gm{background:#DFE0E7;position:sticky;left:0;z-index:3}
.grid tbody th.gm,.grid tr>th.gm{min-width:22px}
.gv{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:2px 0;display:inline-block}
.grid td.gc{background:#fff;color:#A8A8B0;cursor:pointer;user-select:none;-webkit-user-select:none;min-width:26px}
.grid td.gc.on{background:#4A4A52;color:#fff;font-weight:700}
.grid .gi{width:30px;border:0;text-align:center;font-size:inherit;background:none;padding:1px}
.pager{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;padding:8px;
 border-top:1px solid var(--line);background:#fff;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.pager button{color:var(--blue);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:3px}
.pager button:disabled{color:var(--line2)}
.pager select{border:1px solid var(--line2);border-radius:3px;padding:4px 6px;font-size:12px}

/* 목록행 */
.row{background:#fff;border-bottom:1px solid var(--line);padding:11px 12px;display:flex;align-items:center;gap:9px}
.row .t{font-size:12.5px;font-weight:600}
.row .s{font-size:10.5px;color:var(--sub);margin-top:1px}
.row .r{margin-left:auto;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:7px}
.sw{width:38px;height:22px;border-radius:11px;background:#D3D3DB;position:relative;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:18px}

/* ══════ 화상통화 ══════ */
/* 가로 전환: 기기 회전 잠금이 가능하면 실제로 눕히고, 안 되면 화면을 CSS로 90도 돌린다 */
async function goLand(){
  document.body.classList.add('landmode');
  try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
}
function exitLand(){
  document.body.classList.remove('landmode');
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
function connect(){
  clearInterval(ST.ring);$('ring').classList.remove('on');
  $('ph').classList.add('land');$('bar').classList.add('dk');$('call').classList.add('on');goLand();
  const p=ST.cur;p.stt='지도 중';p.docLog=p.docLog||'미제출';
  p.tr=[];p.chat=[{sys:'구급대원님이 입장하셨습니다.'},{sys:'지도의사님이 입장하셨습니다.'}];
  ST.t0=Date.now();addLog('통화 시작');
  drawPanel();drawLog();
  ST.tick=setInterval(()=>{const s=Math.floor((Date.now()-ST.t0)/1000);
    $('ctm').textContent=p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60);
    $('cnow').textContent='현재시각 : '+hms(new Date());},400);
  startCam();
}
function askEnd(){confirmPop('통화 종료','의료지도 통화를 종료하시겠습니까?',endCall);}
function endCall(){
  clearInterval(ST.tick);stopCam();
  const s=Math.floor((Date.now()-ST.t0)/1000);
  const dur=p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60);
  ST.cur.calls.push({at:new Date(),dur,doc:ST.cur.doc+'의사'});
  $('call').classList.remove('on');$('ph').classList.remove('land');$('bar').classList.remove('dk');exitLand();
  go('home');
  pop('통화 종료',`통화 시간 ${dur}\n\n입력한 현장처치기록은 기록 보기 → 현장 처치 기록 / ${ST.cur.dz}기록지에서 확인할 수 있습니다.`,
    [['기록지 작성',()=>{popClose();openRec(ST.cur.id);RTAB='sheet';drawRec();}],['닫기',popClose,1]]);
}

/* 처치 버튼 */
function drawPanel(){
  const set=treatSet(ST.cur.dz);
  $('pnl').innerHTML=set.map((it,i)=>{
    const last=[...ST.cur.tr].reverse().find(t=>t.k===it[0]);
    return `<button class="tb ${it[3]==='w2'?'w2':''} ${last?'h':''}" data-i="${i}">
      <span class="n">${it[0]}</span>${last?`<span class="t">${last.t}</span>`:''}</button>`;}).join('');
  [...$('pnl').children].forEach(b=>{
    const i=+b.dataset.i;let tm,lg=false;
    b.onpointerdown=()=>{lg=false;tm=setTimeout(()=>{lg=true;delTreat(i);},1000);};
    b.onpointerup=()=>{clearTimeout(tm);if(!lg)tapTreat(i);};
    b.onpointerleave=()=>clearTimeout(tm);
    b.oncontextmenu=e=>e.preventDefault();});
}
function addLog(txt){ST.cur.tr.push({k:txt,t:hm(new Date()),full:hms(new Date()),sys:true});}
function drawLog(){
  const L=$('logbox');
  L.innerHTML=ST.cur.tr.map(t=>`<div>${t.full} &gt; ${esc(t.k)}${t.v?': '+esc(t.v):''}</div>`).join('');

}
function saveTreat(k,v){
  ST.cur.tr.push({k,v:v||'',t:hm(new Date()),full:hms(new Date())});
  popClose();drawPanel();drawLog();
}
function tapTreat(i){
  const it=treatSet(ST.cur.dz)[i],nm=it[0];
  if(it[1]==='num'){
    const w=document.createElement('div');
    w.innerHTML=`<div style="font-size:12.5px;color:#4A4A52;margin-bottom:6px">측정 값을 입력 후 입력버튼을 누르세요.</div>
      <div class="kv"><label>${it[2]} :</label><input id="nv" inputmode="decimal" autocomplete="off"></div>`;
    pop('현장 처치내용 입력',w,[['입력',()=>{const v=$('nv').value.trim();
      if(!v)return toast('값을 입력하세요.');saveTreat(nm,v);}],['취소',popClose,1]]);
    setTimeout(()=>$('nv')?.focus(),60);return;
  }
  if(it[1]==='vital'){
    const w=document.createElement('div');
    w.innerHTML=`<div style="font-size:12px;color:var(--sub);margin-bottom:5px">'활력징후'를 선택하여 입력하세요</div>
      <div class="pickg">${['혈압','맥박','호흡','체온'].map(v=>`<button onclick="vitalNext('${v}')">${v}</button>`).join('')}</div>`;
    pop('현장 처치 내용 입력',w,[['취소',popClose,1]]);return;
  }
  if(it[1]==='pick'){
    const w=document.createElement('div');
    w.innerHTML=`<div style="font-size:12px;color:var(--sub);margin-bottom:5px">'${nm.replace('입력','')}'를 선택하여 입력하세요</div>
      <div class="pickg">${it[2].map(v=>`<button onclick="pickSel(this,'${v}')">${v}</button>`).join('')}</div>`;
    PICK=null;
    pop('현장 처치 내용 입력',w,[['입력',()=>{if(!PICK)return toast('항목을 선택하세요.');saveTreat(nm,PICK);}],['취소',popClose,1]]);return;
  }
  confirmPop('현장 처치내용 입력',`'${nm}' 을(를) 현재 시각으로 입력하시겠습니까?`,()=>saveTreat(nm,''));
}
let PICK=null;
function pickSel(b,v){PICK=v;[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function vitalNext(kind){
  const w=document.createElement('div');
  w.innerHTML=`<div style="font-size:12.5px;color:#4A4A52;margin-bottom:6px">측정 값을 입력 후 입력버튼을 누르세요.</div>
    <div class="kv"><label>${kind} :</label><input id="nv" placeholder="${kind==='혈압'?'예) 100/80':''}" autocomplete="off"></div>`;
  pop('현장 처치내용 입력',w,[['입력',()=>{const v=$('nv').value.trim();
    if(!v)return toast('값을 입력하세요.');saveTreat(kind,v);}],['취소',popClose,1]]);
  setTimeout(()=>$('nv')?.focus(),60);
}
function delTreat(i){
  const it=treatSet(ST.cur.dz)[i],nm=it[0];
  if(it[1]==='pick'){
    const w=document.createElement('div');
    w.innerHTML=`<div style="font-size:12px;color:#4A4A52;line-height:1.6;margin-bottom:5px">
      입력을 취소할 ${nm.replace('입력','')}을 선택하여 입력하세요.<br>
      <span style="font-size:11px;color:var(--sub)">(가장 최근에 입력한 동일 항목의 입력이 취소됩니다.)</span></div>
      <div class="pickg">${it[2].map(v=>`<button onclick="pickSel(this,'${v}')">${v}</button>`).join('')}</div>`;
    PICK=null;
    pop('현장 처치내용 입력 취소',w,[['입력',()=>{
      if(!PICK)return toast('항목을 선택하세요.');
      const idx=findLast(nm,PICK);
      if(idx<0){popClose();return toast('입력된 기록이 없습니다.');}
      ST.cur.tr.splice(idx,1);popClose();drawPanel();drawLog();toast(PICK+' 입력을 취소했습니다.');}],['취소',popClose,1]]);
    return;
  }
  const key=it[1]==='vital'?null:nm;
  const idx=key?findLast(key):ST.cur.tr.map(t=>t.k).reduce((a,k,j)=>['혈압','맥박','호흡','체온'].includes(k)?j:a,-1);
  if(idx<0)return toast('입력된 기록이 없습니다.');
  const target=ST.cur.tr[idx];
  confirmPop('현장 처치내용 입력 취소',
    `'${target.k}' 입력 값을 삭제 하시겠습니까?<br><span style="font-size:11.5px;color:var(--sub)">(가장 최근에 입력한 값이 삭제됩니다.)</span>`,
    ()=>{ST.cur.tr.splice(idx,1);drawPanel();drawLog();toast(target.k+' 입력을 취소했습니다.');});
}
function findLast(k,v){for(let i=ST.cur.tr.length-1;i>=0;i--){
  const t=ST.cur.tr[i];if(t.k===k&&(!v||t.v===v))return i;}return -1;}

/* 카메라 */
function camFail(msg,sub){
  $('noc').style.display='grid';
  $('noc').innerHTML=`${msg}<br><span style="font-size:10.5px;color:#6E6E77">${sub}</span><br>
    <button onclick="startCam()">다시 시도</button>`;
}
async function startCam(){
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
    return camFail('이 주소에서는 카메라를 사용할 수 없습니다.',
      'https:// 주소 또는 http://localhost 에서만 카메라가 열립니다.<br>파일을 직접 여는 file:// 방식은 브라우저가 차단합니다.');
  }
  try{stopCam();ST.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:ST.face},audio:false});
    $('vid').srcObject=ST.stream;$('noc').style.display='none';
    if(ST.face==='environment')setTimeout(()=>applyTorch(true),400);else setTorchUI(false);
  }catch(e){
    const n=e.name||'오류';
    const sub=n==='NotAllowedError'?'주소창 왼쪽 자물쇠 → 카메라 → 허용으로 바꾼 뒤 다시 시도하세요.'
      :n==='NotFoundError'?'사용 가능한 카메라를 찾지 못했습니다.'
      :n==='NotReadableError'?'다른 앱이 카메라를 사용 중입니다. 해당 앱을 종료하세요.'
      :'브라우저 권한 설정을 확인하세요.';
    camFail(`카메라를 사용할 수 없습니다. (${n})`,sub);}
}
function stopCam(){if(ST.stream){ST.stream.getTracks().forEach(t=>t.stop());ST.stream=null;}}
function setTorchUI(on){ST.flash=on;$('flbtn').classList.toggle('on',on);}
async function applyTorch(on){
  const tr=ST.stream?.getVideoTracks()[0];if(!tr)return false;
  try{await tr.applyConstraints({advanced:[{torch:on}]});setTorchUI(on);return true;}
  catch(e){setTorchUI(false);return false;}
}
async function toggleFlash(){
  if(ST.face==='user')return toast('플래시는 후면 카메라에서만 동작합니다.');
  if(!ST.stream)return toast('카메라를 먼저 켜주세요.');
  const ok=await applyTorch(!ST.flash);
  toast(ok?(ST.flash?'플래시 ON':'플래시 OFF'):'이 기기·브라우저에서는 플래시를 제어할 수 없습니다.');
}
function flipCam(){ST.face=ST.face==='environment'?'user':'environment';startCam();
  toast(ST.face==='user'?'전면 카메라 · 플래시 OFF':'후면 카메라 · 플래시 ON');}
function toggleMic(){ST.mic=!ST.mic;$('micb').classList.toggle('mute',!ST.mic);toast(ST.mic?'마이크 해제':'마이크 음소거');}
function capture(){
  const v=$('vid');if(!ST.stream||!v.videoWidth)return toast('카메라가 켜져 있어야 캡처할 수 있습니다.');
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);const url=c.toDataURL('image/jpeg',.6);
  ST.cur.caps.push({url,t:hms(new Date())});
  const s=$('snp');s.src=url;s.style.display='block';setTimeout(()=>s.style.display='none',1800);
  success('화면이 정상적으로 업로드되었습니다.');
}

function drawRec(){

      :`<div class="emp">입력된 현장처치기록이 없습니다.<br>화상통화 중 좌측 버튼으로 기록합니다.</div>`;
  }else{

      <select onchange="PAGE=+this.value;drawRec()">${Array.from({length:n},(_,i)=>
        `<option value="${i+1}" ${PAGE===i+1?'selected':''}>${i+1}</option>`).join('')}</select>

/* 페이지 렌더 */
function sheetPage(p,n){
  const [title,rows]=PAGES[p.dz][n-1];
  if(rows.length===1&&rows[0].length===1&&rows[0][0][0]==='grid')
    return `<div class="doc9">${gridPage(p,rows[0][0][1])}</div>`;
  const dis=p.sub?' disabled':'';
  const html=rows.map(r=>{
    if(r[0][0]==='sec')return `<div class="d9s2">${esc(r[0][1])}</div>`;
    if(r[0][0]==='n')return `<div class="d9n">${esc(r[0][1])}</div>`;
    const hasStar=r.some(x=>x[0]==='t'&&/＊/.test(x[1]));
    return `<div class="frw">`+r.map(tk=>{
      const [ty,k]=tk;
      if(ty==='t')return `<span class="fl">${esc(k).replace(/＊/g,'<b class="rq">＊</b>')}</span>`;
      if(ty==='n')return `<span class="d9n">${esc(k)}</span>`;
      if(ty==='i')return `<span class="fi" id="fr-${k}"><input style="width:${tk[2]}px"${dis}
        value="${esc(p.sheet[k]||'')}" oninput="ST.cur.sheet['${k}']=this.value"></span>${tk[3]===1&&!hasStar?'<b class="rq">*</b>':''}`;
      if(ty==='c')return `<span class="fck${p.sheet[k]?' on':''}" onclick="togF('${k}')"></span>`;
      if(ty==='s'){const v=p.sheet[k]||'';
        return `<span class="sg2" id="fr-${k}">${tk[2].map(o=>
          `<button class="${v===o?'on':''}" onclick="setF('${k}','${o}')">${esc(o)}</button>`).join('')}</span>`
          +(tk[3]===1&&!hasStar?'<b class="rq">*</b>':'');}
      return '';
    }).join('')+`</div>`;
  }).join('');
  return `<div class="doc9"><div class="d9h">스마트의료지도 구급대원 ${p.dz} 기록지 <span class="d9v">Ver 7.0</span></div>
    ${html}</div>`;
}
function togF(k){if(ST.cur.sub)return;ST.cur.sheet[k]=ST.cur.sheet[k]?'':'1';drawRec();}
function setF(k,v){if(ST.cur.sub)return;ST.cur.sheet[k]=ST.cur.sheet[k]===v?'':v;drawRec();}

let GZ=1;
function gsync(p){
  const num={'혈압':'bp','맥박':'hr','호흡':'rr','체온':'bt','SPO2':'spo2','BST':'bst','ETCO2':'etco2'};
  const tog={'환자접촉':'contact','i-gel/LT':'igel','제세동':'def','ROSC':'rosc'};
  const rhy={'Asystole':'asys','PEA':'pea','VF':'vf','VT':'vt'};
  const drg={'Epi투여':'epi','Amio투여':'amio','Lidocaine':'lido'};
  p.grid=p.grid||{};
  p.tr.filter(t=>!t.sys).forEach(t=>{
    const m=String(t.full||'').slice(3,5);if(!m)return;
    if(num[t.k]&&t.v&&!p.grid[m+':'+num[t.k]])p.grid[m+':'+num[t.k]]=t.v;
    if(tog[t.k])p.grid[m+':'+tog[t.k]]=1;
    if(t.k==='IV/IO')p.grid[m+':iv']=1;
    if(t.k==='리듬입력'&&rhy[t.v])p.grid[m+':'+rhy[t.v]]=1;
    if(t.k==='약물투여입력'&&drg[t.v])p.grid[m+':'+drg[t.v]]=1;
  });
}
function gridPage(p,half){
  gsync(p);const g=p.grid,d=p.sub?' disabled':'',a=half*30,b=a+30;
  const cell=(m,k,l,ty)=>ty==='c'
    ? `<td class="gc${g[m+':'+k]?' on':''}" onclick="gtog('${m}','${k}')">${esc(l)}</td>`
    : `<td><input class="gi" value="${esc(g[m+':'+k]||'')}"${d} oninput="gset('${m}','${k}',this.value)"></td>`;
  let body='';
  for(let i=a;i<b;i++){const m=p2(i);
    body+=`<tr><th class="gm">${m}</th>`
      +cell(m,'contact','접촉','c')
      +GNUM.map(([k])=>cell(m,k,'','n')).join('')
      +GRHY.map(([k,l])=>cell(m,k,l.slice(0,4),'c')).join('')
      +GEND.map(([k,l,ty])=>cell(m,k,l.length>5?l.slice(0,4):l,ty)).join('')
      +'</tr>';}
  const vt=t=>`<span class="gv">${esc(t)}</span>`;
  return `<div class="d9g">시간별 상황 기록(경과시간이 아닌 "실제시간,분"에 체크하시면 됩니다.) - ${half+1}/2</div>
    <div class="gzoom">표 크기 <button onclick="GZ=Math.max(.6,GZ-.15);drawRec()">－</button>
      <button onclick="GZ=Math.min(2,GZ+.15);drawRec()">＋</button>
      <button onclick="GZ=1;drawRec()">100%</button></div>
    <div class="gwrap"><table class="grid" style="font-size:${(8.5*GZ).toFixed(1)}px">
      <tr><th class="gm" rowspan="2">${vt('시간(분)')}</th><th rowspan="2">${vt('환자접촉')}</th>
        <th colspan="4">활력징후</th>
        ${['SPO2','BST'].map(x=>`<th rowspan="2">${vt(x)}</th>`).join('')}
        ${GRHY.map(([,l])=>`<th rowspan="2">${vt(l)}</th>`).join('')}
        ${GEND.map(([,l])=>`<th rowspan="2">${vt(l)}</th>`).join('')}</tr>
      <tr>${['혈압','맥박','호흡','체온'].map(x=>`<th>${vt(x)}</th>`).join('')}</tr>
      ${body}</table></div>`;
}
function gtog(m,k){if(ST.cur.sub)return;const g=ST.cur.grid=ST.cur.grid||{};
  g[m+':'+k]?delete g[m+':'+k]:g[m+':'+k]=1;drawRec();}
function gset(m,k,v){const g=ST.cur.grid=ST.cur.grid||{};v?g[m+':'+k]=v:delete g[m+':'+k];}

function submitSheet(){
  const p=ST.cur;let miss=[];
  PAGES[p.dz].forEach(([t,rows],pi)=>{
    let sec='';
    rows.forEach(r=>{if(r[0][0]==='sec')sec=r[0][1];r.forEach(tk=>{
      const ty=tk[0],k=tk[1];
      if(ty!=='i'&&ty!=='s')return;
      const req=(ty==='i'&&tk[3]===1)||(ty==='s'&&tk[3]===1);
      if(req&&!p.sheet[k]){
        const lab=(ty==='s')?(r.find(x=>x[0]==='t')||[,k])[1]:(r.find(x=>x[0]==='t')||[,k])[1];
        let nm=String(lab).replace(/[＊*:●→]/g,'').trim();
        if(sec&&nm.length<5&&!nm.includes(sec))nm=sec+' '+nm;
        miss.push([pi+1,nm,k]);
      }
    });});
  });
  if(miss.length){
    const w=document.createElement('div');
    w.innerHTML=`<div style="font-size:12.5px;color:#4A4A52;line-height:1.7;text-align:center">
      [${miss[0][0]}페이지]로 이동하여 입력하시겠습니까?<br><br>누락된 항목:
      <div style="color:var(--red);margin-top:4px">
      ${miss.slice(0,10).map(m=>`· ${m[1]}`).join('<br>')}${miss.length>10?'<br>…':''}</div></div>`;
    pop('필수 입력 안내',w,[['이동',()=>{popClose();PAGE=miss[0][0];drawRec();
      setTimeout(()=>$('fr-'+miss[0][2])?.classList.add('miss'),60);}],['아니요',popClose,1]],
      '필수 입력 항목이 누락되었습니다.');
    return;
  }
  confirmPop('제출 확인','구급대 기록지 작성을 완료하시겠습니까?',()=>{
    p.sub=true;p.emtLog='제출완료';if(p.stt==='이송완료')p.stt='최종완료';
    drawRec();success('구급대원 일지가 제출되었습니다.');});
}
